# Supabase local development configuration.
# This project has not yet been linked to a hosted Supabase project — no
# project ref, keys, or secrets are stored here or anywhere in this repo.
# Run `supabase link --project-ref <ref>` once a real project exists.
project_id = "ngc-erp"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://ngc.co.tz"]
jwt_expiry = 3600
enable_signup = false          # internal accounts are provisioned by Super Admin/Secretary, not self-signup
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
